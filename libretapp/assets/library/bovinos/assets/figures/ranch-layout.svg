<svg width="100%" viewBox="0 0 680 520" role="img" xmlns="http://www.w3.org/2000/svg">
<title>F-01: Ranch Layout and Land Use Planning</title>
<desc>Diagram showing a typical tropical/semi-arid cattle ranch layout with pasture zones, water infrastructure, handling facilities, and shelter areas.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <pattern id="hatch-green" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="8" stroke="#5DCAA5" stroke-width="1.2" stroke-opacity="0.35"/>
  </pattern>
  <pattern id="hatch-amber" patternUnits="userSpaceOnUse" width="8" height="8" patternTransform="rotate(45)">
    <line x1="0" y1="0" x2="0" y2="8" stroke="#EF9F27" stroke-width="1.2" stroke-opacity="0.3"/>
  </pattern>
  <pattern id="hatch-blue" patternUnits="userSpaceOnUse" width="6" height="6">
    <circle cx="3" cy="3" r="1" fill="#378ADD" fill-opacity="0.4"/>
  </pattern>
</defs>

<!-- Background -->
<rect x="0" y="0" width="680" height="520" fill="#F8F7F2" rx="0"/>

<!-- Title -->
<text x="340" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">F-01 — Ranch layout and land use planning</text>
<text x="340" y="44" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#888780">Tropical / semi-arid beef operation · not to scale</text>

<!-- Outer perimeter fence -->
<rect x="40" y="60" width="480" height="420" rx="8" fill="none" stroke="#5F5E5A" stroke-width="2" stroke-dasharray="6 3"/>
<text x="48" y="74" font-family="system-ui, sans-serif" font-size="10" fill="#888780">— — perimeter fence</text>

<!-- PASTURES — 6 rotational paddocks -->
<!-- Paddock 1 -->
<rect x="48" y="78" width="148" height="118" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<rect x="48" y="78" width="148" height="118" rx="4" fill="url(#hatch-green)" stroke="none"/>
<text x="122" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#085041">Paddock 1</text>
<text x="122" y="148" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#0F6E56">Grazing zone</text>

<!-- Paddock 2 -->
<rect x="204" y="78" width="148" height="118" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<rect x="204" y="78" width="148" height="118" rx="4" fill="url(#hatch-green)" stroke="none"/>
<text x="278" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#085041">Paddock 2</text>
<text x="278" y="148" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#0F6E56">Resting</text>

<!-- Paddock 3 -->
<rect x="360" y="78" width="148" height="118" rx="4" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<rect x="360" y="78" width="148" height="118" rx="4" fill="url(#hatch-green)" stroke="none"/>
<text x="434" y="132" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#085041">Paddock 3</text>
<text x="434" y="148" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#0F6E56">Resting</text>

<!-- Paddock 4 -->
<rect x="48" y="204" width="148" height="118" rx="4" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<rect x="48" y="204" width="148" height="118" rx="4" fill="url(#hatch-green)" stroke="none"/>
<text x="122" y="258" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#27500A">Paddock 4</text>
<text x="122" y="274" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#3B6D11">Resting</text>

<!-- Paddock 5 -->
<rect x="204" y="204" width="148" height="118" rx="4" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
<rect x="204" y="204" width="148" height="118" rx="4" fill="url(#hatch-green)" stroke="none"/>
<text x="278" y="258" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#27500A">Paddock 5</text>
<text x="278" y="274" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#3B6D11">Resting</text>

<!-- Paddock 6 — sacrifice / dry season -->
<rect x="360" y="204" width="148" height="118" rx="4" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5" stroke-dasharray="4 2"/>
<rect x="360" y="204" width="148" height="118" rx="4" fill="url(#hatch-amber)" stroke="none"/>
<text x="434" y="252" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#633806">Paddock 6</text>
<text x="434" y="268" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#854F0B">Sacrifice / dry season</text>

<!-- Central lane / alley -->
<rect x="190" y="78" width="16" height="244" rx="3" fill="#D3D1C7" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="198" y="205" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5F5E5A" transform="rotate(-90,198,205)">Alley / lane</text>
<rect x="346" y="78" width="16" height="244" rx="3" fill="#D3D1C7" stroke="#B4B2A9" stroke-width="0.5"/>

<!-- Horizontal lane between rows -->
<rect x="48" y="190" width="460" height="16" rx="3" fill="#D3D1C7" stroke="#B4B2A9" stroke-width="0.5"/>

<!-- Water infrastructure zone -->
<rect x="48" y="330" width="220" height="100" rx="6" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<rect x="48" y="330" width="220" height="100" rx="6" fill="url(#hatch-blue)" stroke="none"/>
<!-- Water tank -->
<ellipse cx="110" cy="375" rx="28" ry="20" fill="#B5D4F4" stroke="#185FA5" stroke-width="1.5"/>
<ellipse cx="110" cy="368" rx="28" ry="8" fill="#85B7EB" stroke="#185FA5" stroke-width="1"/>
<text x="110" y="405" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#0C447C">Storage tank</text>
<!-- Trough -->
<rect x="170" y="362" width="72" height="22" rx="4" fill="#B5D4F4" stroke="#185FA5" stroke-width="1"/>
<text x="206" y="399" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#0C447C">Water trough</text>
<!-- Well -->
<circle cx="88" cy="348" r="8" fill="#85B7EB" stroke="#185FA5" stroke-width="1.5"/>
<line x1="84" y1="340" x2="92" y2="340" stroke="#185FA5" stroke-width="1.5"/>
<line x1="88" y1="336" x2="88" y2="340" stroke="#185FA5" stroke-width="1.5"/>
<text x="88" y="336" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#0C447C">Well</text>
<text x="134" y="344" text-anchor="start" font-family="system-ui, sans-serif" font-size="10" fill="#185FA5" font-weight="500">Water zone</text>

<!-- Water pipes to paddocks -->
<line x1="140" y1="330" x2="140" y2="322" stroke="#378ADD" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arrow)"/>
<line x1="200" y1="330" x2="200" y2="322" stroke="#378ADD" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arrow)"/>

<!-- Handling facilities -->
<rect x="290" y="330" width="218" height="100" rx="6" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<!-- Squeeze chute -->
<rect x="304" y="348" width="52" height="40" rx="3" fill="#F5C4B3" stroke="#993C1D" stroke-width="1"/>
<text x="330" y="364" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="500" fill="#4A1B0C">Squeeze</text>
<text x="330" y="375" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#712B13">chute</text>
<!-- Working pen -->
<rect x="364" y="342" width="58" height="52" rx="3" fill="#F5C4B3" stroke="#993C1D" stroke-width="1"/>
<text x="393" y="364" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="500" fill="#4A1B0C">Working</text>
<text x="393" y="375" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#712B13">pen</text>
<!-- Loading ramp -->
<rect x="430" y="355" width="62" height="30" rx="3" fill="#F0997B" stroke="#993C1D" stroke-width="1"/>
<text x="461" y="366" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="500" fill="#4A1B0C">Loading</text>
<text x="461" y="377" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#712B13">ramp</text>
<text x="340" y="346" text-anchor="start" font-family="system-ui, sans-serif" font-size="10" fill="#993C1D" font-weight="500">Handling facilities</text>
<text x="399" y="406" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#712B13">Feed &amp; medicine storage →</text>

<!-- Shelter -->
<rect x="48" y="446" width="110" height="30" rx="4" fill="#D3D1C7" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="103" y="466" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="500" fill="#2C2C2A">Shade shelter</text>
<!-- Calving pen -->
<rect x="170" y="446" width="110" height="30" rx="4" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="225" y="466" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="500" fill="#3C3489">Calving pen</text>
<!-- Quarantine -->
<rect x="292" y="446" width="110" height="30" rx="4" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5" stroke-dasharray="3 2"/>
<text x="347" y="466" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="500" fill="#501313">Quarantine</text>
<!-- Access road -->
<rect x="414" y="446" width="94" height="30" rx="4" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="461" y="466" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="500" fill="#444441">Access road →</text>

<!-- Legend -->
<rect x="536" y="60" width="136" height="235" rx="6" fill="white" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="604" y="80" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#2C2C2A">Legend</text>

<rect x="548" y="92" width="14" height="14" rx="2" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<rect x="548" y="92" width="14" height="14" rx="2" fill="url(#hatch-green)" stroke="none"/>
<text x="568" y="103" font-family="system-ui, sans-serif" font-size="10" fill="#2C2C2A">Active pasture</text>

<rect x="548" y="114" width="14" height="14" rx="2" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5" stroke-dasharray="3 2"/>
<rect x="548" y="114" width="14" height="14" rx="2" fill="url(#hatch-amber)" stroke="none"/>
<text x="568" y="125" font-family="system-ui, sans-serif" font-size="10" fill="#2C2C2A">Sacrifice paddock</text>

<rect x="548" y="136" width="14" height="14" rx="2" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="568" y="147" font-family="system-ui, sans-serif" font-size="10" fill="#2C2C2A">Water zone</text>

<rect x="548" y="158" width="14" height="14" rx="2" fill="#FAECE7" stroke="#993C1D" stroke-width="1"/>
<text x="568" y="169" font-family="system-ui, sans-serif" font-size="10" fill="#2C2C2A">Handling / facilities</text>

<rect x="548" y="180" width="14" height="14" rx="2" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="568" y="191" font-family="system-ui, sans-serif" font-size="10" fill="#2C2C2A">Calving area</text>

<rect x="548" y="202" width="14" height="14" rx="2" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5" stroke-dasharray="3 2"/>
<text x="568" y="213" font-family="system-ui, sans-serif" font-size="10" fill="#2C2C2A">Quarantine</text>

<rect x="548" y="224" width="14" height="4" rx="2" fill="#D3D1C7" stroke="#B4B2A9" stroke-width="0.5"/>
<text x="568" y="230" font-family="system-ui, sans-serif" font-size="10" fill="#2C2C2A">Lane / alley</text>

<line x1="548" y1="247" x2="562" y2="247" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="4 2"/>
<text x="568" y="251" font-family="system-ui, sans-serif" font-size="10" fill="#2C2C2A">Perimeter fence</text>

<line x1="548" y1="270" x2="562" y2="270" stroke="#378ADD" stroke-width="1.5" stroke-dasharray="3 2" marker-end="url(#arrow)"/>
<text x="568" y="274" font-family="system-ui, sans-serif" font-size="10" fill="#2C2C2A">Water pipe</text>

<!-- Key note -->
<rect x="536" y="304" width="136" height="88" rx="6" fill="#F1EFE8" stroke="#D3D1C7" stroke-width="0.5"/>
<text x="604" y="322" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="500" fill="#2C2C2A">Design notes</text>
<text x="544" y="338" font-family="system-ui, sans-serif" font-size="9" fill="#5F5E5A">· Min. 8 paddocks for</text>
<text x="544" y="350" font-family="system-ui, sans-serif" font-size="9" fill="#5F5E5A">  effective rotation</text>
<text x="544" y="362" font-family="system-ui, sans-serif" font-size="9" fill="#5F5E5A">· Water ≤800 m/paddock</text>
<text x="544" y="374" font-family="system-ui, sans-serif" font-size="9" fill="#5F5E5A">· Centralize handling</text>
<text x="544" y="386" font-family="system-ui, sans-serif" font-size="9" fill="#5F5E5A">  near road access</text>

<!-- Rotation arrows showing flow between paddocks -->
<path d="M196 137 L206 137" stroke="#0F6E56" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<path d="M352 137 L362 137" stroke="#0F6E56" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<path d="M122 196 L122 206" stroke="#0F6E56" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<path d="M278 196 L278 206" stroke="#0F6E56" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/>
<path d="M434 196 L434 206" stroke="#854F0B" stroke-width="1.5" stroke-dasharray="3 2" fill="none" marker-end="url(#arrow)"/>

<!-- Figure caption -->
<text x="340" y="500" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#888780">Figure F-01 · Arrows show rotation sequence · Sacrifice paddock used during dry season when others rest</text>
</svg>