<svg width="100%" viewBox="0 0 680 560" role="img" xmlns="http://www.w3.org/2000/svg">
<title>F-02: BCS 1–9 Scoring Chart for Bos indicus Beef Cattle</title>
<desc>Body Condition Scoring chart showing scores 1 through 9 for Bos indicus beef cattle, with silhouette-style illustrations and palpation landmarks for each score level. Optimal range is BCS 5–6.</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<rect x="0" y="0" width="680" height="560" fill="#F8F7F2"/>

<!-- Title -->
<text x="340" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">F-02 — Body Condition Scoring (BCS 1–9) · Bos indicus beef cattle</text>
<text x="340" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#888780">Palpation sites: short ribs · spine (mid-back to tailhead) · hook and pin bones</text>

<!-- Score band gradient bar -->
<defs>
  <linearGradient id="bcs-gradient" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#E24B4A"/>
    <stop offset="25%" stop-color="#EF9F27"/>
    <stop offset="50%" stop-color="#1D9E75"/>
    <stop offset="75%" stop-color="#1D9E75"/>
    <stop offset="100%" stop-color="#BA7517"/>
  </linearGradient>
</defs>
<rect x="40" y="54" width="600" height="8" rx="4" fill="url(#bcs-gradient)"/>

<!-- 9 score columns -->
<!-- Col width = 600/9 = ~66.6 each, starting x=40 -->

<!-- Helper macro approach: draw each score box -->
<!-- Score 1 -->
<rect x="40" y="68" width="64" height="420" rx="4" fill="#FCEBEB" stroke="#E24B4A" stroke-width="0.5"/>
<text x="72" y="86" text-anchor="middle" font-family="system-ui, sans-serif" font-size="18" font-weight="500" fill="#A32D2D">1</text>
<text x="72" y="100" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="500" fill="#791F1F">Emaciated</text>
<!-- Cattle silhouette BCS1 - very bony, angular -->
<g transform="translate(72,165)">
  <!-- Body - very thin angular -->
  <ellipse cx="0" cy="0" rx="18" ry="28" fill="#F09595" stroke="#E24B4A" stroke-width="1"/>
  <!-- Prominent ribs - multiple lines -->
  <line x1="-14" y1="-16" x2="-6" y2="-8" stroke="#A32D2D" stroke-width="1.5"/>
  <line x1="-14" y1="-8" x2="-6" y2="0" stroke="#A32D2D" stroke-width="1.5"/>
  <line x1="-14" y1="0" x2="-6" y2="8" stroke="#A32D2D" stroke-width="1.5"/>
  <line x1="-14" y1="8" x2="-6" y2="16" stroke="#A32D2D" stroke-width="1.5"/>
  <!-- Sharp hip bones -->
  <polygon points="-16,-24 -8,-30 0,-24" fill="#E24B4A" opacity="0.7"/>
  <polygon points="16,-24 8,-30 0,-24" fill="#E24B4A" opacity="0.7"/>
  <!-- Sharp spine -->
  <polyline points="-4,-28 -2,-20 -2,-10 -2,0 -2,10 -2,20 -2,28" fill="none" stroke="#A32D2D" stroke-width="2"/>
  <!-- Pin bones very prominent -->
  <circle cx="-14" cy="22" r="4" fill="none" stroke="#E24B4A" stroke-width="1.5"/>
  <circle cx="14" cy="22" r="4" fill="none" stroke="#E24B4A" stroke-width="1.5"/>
</g>
<text x="72" y="250" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#791F1F">Bone structure</text>
<text x="72" y="261" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#791F1F">visible · no fat</text>
<text x="72" y="280" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#888780">Spine</text>
<circle cx="72" cy="290" r="3" fill="none" stroke="#A32D2D" stroke-width="1.5"/>
<text x="72" y="308" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#888780">Ribs</text>
<rect x="58" y="314" width="28" height="6" rx="1" fill="none" stroke="#A32D2D" stroke-width="1" stroke-dasharray="2 1"/>
<text x="72" y="336" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#888780">Hips</text>
<polygon points="66,342 72,338 78,342" fill="none" stroke="#A32D2D" stroke-width="1.5"/>
<text x="72" y="368" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#A32D2D" font-weight="500">Near</text>
<text x="72" y="378" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#A32D2D" font-weight="500">death</text>

<!-- Score 2 -->
