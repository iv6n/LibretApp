<!-- Caption -->
<text x="340" y="504" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#888780">Figure F-02 · BCS assessed by palpating short ribs, spine, and hook/pin bones · Score 5–6 optimal for most production stages</text>
