<svg width="100%" viewBox="0 0 680 420" role="img" xmlns="http://www.w3.org/2000/svg">
<title>F-07: Rotational Grazing Paddock Layout — 8-Paddock and 12-Paddock Radial Designs</title>
<desc>Two radial paddock layout diagrams showing 8-paddock and 12-paddock rotational grazing systems with a central water source and spoke-style access lanes connecting all paddocks to the center.</desc>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
    <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
  <pattern id="grass" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(30)">
    <line x1="5" y1="0" x2="5" y2="10" stroke="#1D9E75" stroke-width="0.8" stroke-opacity="0.2"/>
  </pattern>
  <pattern id="grass2" patternUnits="userSpaceOnUse" width="10" height="10" patternTransform="rotate(60)">
    <line x1="5" y1="0" x2="5" y2="10" stroke="#0F6E56" stroke-width="0.8" stroke-opacity="0.15"/>
  </pattern>
</defs>

<rect x="0" y="0" width="680" height="420" fill="#F8F7F2"/>
<text x="340" y="22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">F-07 — Rotational grazing paddock layout · radial design</text>
<text x="340" y="38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#888780">Central water point with spoke lanes to all paddocks · temporary electric fencing recommended for year 1</text>

<!-- ============ 8-PADDOCK DIAGRAM (left) ============ -->
<text x="168" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#2C2C2A">8-Paddock System</text>
<text x="168" y="71" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#888780">Min. recommended · rainy season ~21–28 day rest</text>

<!-- Center: cx=168, cy=230, outer radius=140, inner (lane) radius=22 -->
<!-- 8 paddocks at 45° intervals -->
<!-- Draw paddock wedges using paths -->
<!-- Each wedge from inner r=28 to outer r=138, spanning 40° (leaving 5° for lane) -->

<!-- Paddock colors: alternating green shades, one highlighted as "grazing now" -->
<g transform="translate(168,230)">
  <!-- Paddock wedges (8 pieces at 45° each, drawn as arcs) -->
  <!-- Using approximated polygon paths for clarity -->
  <!-- P1: 0°-45° (top-right) — GRAZING NOW -->
  <path d="M21,0 L120,0 A120,120 0 0,0 84.8,-84.8 L21,0 Z" fill="#E8F7E8" stroke="#0F6E56" stroke-width="1"/>
  <path d="M21,0 L120,0 A120,120 0 0,0 84.8,-84.8 L21,0 Z" fill="url(#grass)" stroke="none"/>
  <rect x="52" y="-42" width="48" height="18" rx="9" fill="#1D9E75" transform="rotate(22.5,52,-42) translate(-24,-9)"/>
  <text x="72" y="-38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="500" fill="white" transform="rotate(-22.5,72,-38)">GRAZING</text>

  <!-- P2: 45°-90° -->
  <path d="M0,-21 L0,-120 A120,120 0 0,0 84.8,-84.8 L0,-21 Z" fill="#D5F0E8" stroke="#0F6E56" stroke-width="1"/>
  <path d="M0,-21 L0,-120 A120,120 0 0,0 84.8,-84.8 L0,-21 Z" fill="url(#grass)" stroke="none"/>
  <text x="35" y="-75" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="500" fill="#085041">P2</text>
  <text x="35" y="-63" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#085041">Day 4</text>

  <!-- P3: 90°-135° -->
  <path d="M-21,0 L-120,0 A120,120 0 0,1 -84.8,-84.8 L-21,0 Z" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <path d="M-21,0 L-120,0 A120,120 0 0,1 -84.8,-84.8 L-21,0 Z" fill="url(#grass)" stroke="none"/>
  <text x="-72" y="-38" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="500" fill="#085041">P3</text>
  <text x="-72" y="-26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#085041">Resting</text>

  <!-- P4: 135°-180° -->
  <path d="M-21,0 L-120,0 A120,120 0 0,0 -84.8,84.8 L-21,0 Z" fill="#D5F0E8" stroke="#0F6E56" stroke-width="1"/>
  <path d="M-21,0 L-120,0 A120,120 0 0,0 -84.8,84.8 L-21,0 Z" fill="url(#grass2)" stroke="none"/>
  <text x="-72" y="42" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="500" fill="#085041">P4</text>
  <text x="-72" y="54" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#085041">Resting</text>

  <!-- P5: 180°-225° -->
  <path d="M0,21 L0,120 A120,120 0 0,1 -84.8,84.8 L0,21 Z" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <path d="M0,21 L0,120 A120,120 0 0,1 -84.8,84.8 L0,21 Z" fill="url(#grass)" stroke="none"/>
  <text x="-38" y="80" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="500" fill="#085041">P5</text>
  <text x="-38" y="92" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#085041">Resting</text>

  <!-- P6: 225°-270° — sacrifice/dry -->
  <path d="M0,21 L0,120 A120,120 0 0,0 84.8,84.8 L0,21 Z" fill="#FAEEDA" stroke="#EF9F27" stroke-width="1" stroke-dasharray="4 2"/>
  <path d="M0,21 L0,120 A120,120 0 0,0 84.8,84.8 L0,21 Z" fill="url(#grass)" stroke="none" opacity="0.5"/>
  <text x="38" y="82" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="500" fill="#633806">P6</text>
  <text x="38" y="94" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#854F0B">Sacrifice</text>

  <!-- P7: 270°-315° -->
  <path d="M21,0 L120,0 A120,120 0 0,1 84.8,84.8 L21,0 Z" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
  <path d="M21,0 L120,0 A120,120 0 0,1 84.8,84.8 L21,0 Z" fill="url(#grass2)" stroke="none"/>
  <text x="72" y="56" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="500" fill="#085041">P7</text>
  <text x="72" y="68" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#085041">Resting</text>

  <!-- P8: 315°-360° -->
  <path d="M21,0 L120,0 A120,120 0 0,0 84.8,-84.8 L21,0 Z" fill="#D5F0E8" stroke="#0F6E56" stroke-width="1"/>
  <path d="M21,0 L120,0 A120,120 0 0,0 84.8,-84.8 L21,0 Z" fill="url(#grass)" stroke="none"/>
  <text x="82" y="-28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" font-weight="500" fill="#085041">P8</text>
  <text x="82" y="-16" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#085041">Resting</text>

  <!-- Spoke lanes (white lines from center) -->
  <line x1="0" y1="-22" x2="0" y2="-138" stroke="white" stroke-width="6"/>
  <line x1="0" y1="-22" x2="0" y2="-138" stroke="#D3D1C7" stroke-width="1.5" stroke-dasharray="3 2"/>
  <line x1="22" y1="0" x2="138" y2="0" stroke="white" stroke-width="6"/>
  <line x1="22" y1="0" x2="138" y2="0" stroke="#D3D1C7" stroke-width="1.5" stroke-dasharray="3 2"/>
  <line x1="0" y1="22" x2="0" y2="138" stroke="white" stroke-width="6"/>
  <line x1="0" y1="22" x2="0" y2="138" stroke="#D3D1C7" stroke-width="1.5" stroke-dasharray="3 2"/>
  <line x1="-22" y1="0" x2="-138" y2="0" stroke="white" stroke-width="6"/>
  <line x1="-22" y1="0" x2="-138" y2="0" stroke="#D3D1C7" stroke-width="1.5" stroke-dasharray="3 2"/>
  <line x1="15.5" y1="-15.5" x2="97.6" y2="-97.6" stroke="white" stroke-width="6"/>
  <line x1="15.5" y1="-15.5" x2="97.6" y2="-97.6" stroke="#D3D1C7" stroke-width="1.5" stroke-dasharray="3 2"/>
  <line x1="-15.5" y1="-15.5" x2="-97.6" y2="-97.6" stroke="white" stroke-width="6"/>
  <line x1="-15.5" y1="-15.5" x2="-97.6" y2="-97.6" stroke="#D3D1C7" stroke-width="1.5" stroke-dasharray="3 2"/>
  <line x1="-15.5" y1="15.5" x2="-97.6" y2="97.6" stroke="white" stroke-width="6"/>
  <line x1="-15.5" y1="15.5" x2="-97.6" y2="97.6" stroke="#D3D1C7" stroke-width="1.5" stroke-dasharray="3 2"/>
  <line x1="15.5" y1="15.5" x2="97.6" y2="97.6" stroke="white" stroke-width="6"/>
  <line x1="15.5" y1="15.5" x2="97.6" y2="97.6" stroke="#D3D1C7" stroke-width="1.5" stroke-dasharray="3 2"/>

  <!-- Outer circle border -->
  <circle cx="0" cy="0" r="138" fill="none" stroke="#5F5E5A" stroke-width="1.5"/>

  <!-- Center water point -->
  <circle cx="0" cy="0" r="22" fill="#E6F1FB" stroke="#185FA5" stroke-width="2"/>
  <text x="0" y="-4" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="500" fill="#0C447C">WATER</text>
  <text x="0" y="8" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" fill="#185FA5">+ handling</text>

  <!-- Rotation arrow -->
  <path d="M0,-130 A130,130 0 0,1 92,92" fill="none" stroke="#1D9E75" stroke-width="2.5" marker-end="url(#arr)" stroke-dasharray="6 3"/>
</g>

<!-- 8-paddock spec notes -->
<text x="168" y="384" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5F5E5A">7 paddocks resting · 1 grazing</text>
<text x="168" y="396" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5F5E5A">Rest period ÷ grazing period + 1 = 8</text>
<text x="168" y="408" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5F5E5A">Example: 21d rest ÷ 3d/paddock = 7 + 1</text>

<!-- Divider -->
<line x1="336" y1="50" x2="336" y2="415" stroke="#D3D1C7" stroke-width="1" stroke-dasharray="4 3"/>

<!-- ============ 12-PADDOCK DIAGRAM (right) ============ -->
<text x="510" y="58" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#2C2C2A">12-Paddock System</text>
<text x="510" y="71" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#888780">Dry season · 60 day rest / 5 day grazing</text>

<!-- 12-paddock: cx=510, cy=230, R=130 -->
<!-- 12 wedges at 30° intervals -->
<g transform="translate(510,230)">
  <!-- Wedge helper: each wedge spans 28° leaving 2° for lane -->
  <!-- Using precomputed sin/cos values for 12 positions at 30° intervals -->
  <!-- Positions: 0,30,60,90,120,150,180,210,240,270,300,330 degrees -->
  <!-- sin/cos pairs (outer point at r=125): -->
  <!-- 0°: (125,0), 30°: (108.3,62.5), 60°: (62.5,108.3), 90°: (0,125) -->
  <!-- 120°: (-62.5,108.3), 150°: (-108.3,62.5), 180°: (-125,0) -->
  <!-- 210°: (-108.3,-62.5), 240°: (-62.5,-108.3), 270°: (0,-125) -->
  <!-- 300°: (62.5,-108.3), 330°: (108.3,-62.5) -->

  <!-- P1 0-30 -->
  <path d="M19,0 L125,0 A125,125 0 0,0 108.3,-62.5 L16.5,-9.5 Z" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <path d="M19,0 L125,0 A125,125 0 0,0 108.3,-62.5 L16.5,-9.5 Z" fill="url(#grass)" stroke="none"/>
  <text x="90" y="-22" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="500" fill="#085041">P1</text>
  <!-- P2 30-60 — grazing now -->
  <path d="M16.5,-9.5 L108.3,-62.5 A125,125 0 0,0 62.5,-108.3 L9.5,-16.5 Z" fill="#1D9E75" stroke="#085041" stroke-width="0.8"/>
  <text x="78" y="-70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="500" fill="white">GRAZING</text>
  <!-- P3 60-90 -->
  <path d="M9.5,-16.5 L62.5,-108.3 A125,125 0 0,0 0,-125 L0,-19 Z" fill="#D5F0E8" stroke="#0F6E56" stroke-width="0.8"/>
  <path d="M9.5,-16.5 L62.5,-108.3 A125,125 0 0,0 0,-125 L0,-19 Z" fill="url(#grass)" stroke="none"/>
  <text x="28" y="-90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="500" fill="#085041">P3</text>
  <!-- P4 90-120 -->
  <path d="M0,-19 L0,-125 A125,125 0 0,0 -62.5,-108.3 L-9.5,-16.5 Z" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <path d="M0,-19 L0,-125 A125,125 0 0,0 -62.5,-108.3 L-9.5,-16.5 Z" fill="url(#grass2)" stroke="none"/>
  <text x="-28" y="-90" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="500" fill="#085041">P4</text>
  <!-- P5 120-150 -->
  <path d="M-9.5,-16.5 L-62.5,-108.3 A125,125 0 0,0 -108.3,-62.5 L-16.5,-9.5 Z" fill="#D5F0E8" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="-78" y="-70" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="500" fill="#085041">P5</text>
  <!-- P6 150-180 -->
  <path d="M-16.5,-9.5 L-108.3,-62.5 A125,125 0 0,0 -125,0 L-19,0 Z" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <path d="M-16.5,-9.5 L-108.3,-62.5 A125,125 0 0,0 -125,0 L-19,0 Z" fill="url(#grass)" stroke="none"/>
  <text x="-92" y="-24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="500" fill="#085041">P6</text>
  <!-- P7 180-210 -->
  <path d="M-19,0 L-125,0 A125,125 0 0,0 -108.3,62.5 L-16.5,9.5 Z" fill="#D5F0E8" stroke="#0F6E56" stroke-width="0.8"/>
  <path d="M-19,0 L-125,0 A125,125 0 0,0 -108.3,62.5 L-16.5,9.5 Z" fill="url(#grass2)" stroke="none"/>
  <text x="-92" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="500" fill="#085041">P7</text>
  <!-- P8 210-240 -->
  <path d="M-16.5,9.5 L-108.3,62.5 A125,125 0 0,0 -62.5,108.3 L-9.5,16.5 Z" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="-78" y="74" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="500" fill="#085041">P8</text>
  <!-- P9 240-270 -->
  <path d="M-9.5,16.5 L-62.5,108.3 A125,125 0 0,0 0,125 L0,19 Z" fill="#D5F0E8" stroke="#0F6E56" stroke-width="0.8"/>
  <path d="M-9.5,16.5 L-62.5,108.3 A125,125 0 0,0 0,125 L0,19 Z" fill="url(#grass)" stroke="none"/>
  <text x="-28" y="94" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="500" fill="#085041">P9</text>
  <!-- P10 270-300 sacrifice -->
  <path d="M0,19 L0,125 A125,125 0 0,0 62.5,108.3 L9.5,16.5 Z" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.8" stroke-dasharray="3 2"/>
  <text x="30" y="94" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="500" fill="#854F0B">P10</text>
  <!-- P11 300-330 -->
  <path d="M9.5,16.5 L62.5,108.3 A125,125 0 0,0 108.3,62.5 L16.5,9.5 Z" fill="#D5F0E8" stroke="#0F6E56" stroke-width="0.8"/>
  <path d="M9.5,16.5 L62.5,108.3 A125,125 0 0,0 108.3,62.5 L16.5,9.5 Z" fill="url(#grass2)" stroke="none"/>
  <text x="78" y="72" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="500" fill="#085041">P11</text>
  <!-- P12 330-360 -->
  <path d="M16.5,9.5 L108.3,62.5 A125,125 0 0,0 125,0 L19,0 Z" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/>
  <text x="92" y="28" text-anchor="middle" font-family="system-ui, sans-serif" font-size="8" font-weight="500" fill="#085041">P12</text>

  <!-- Spoke lanes (12 directions) -->
  <g stroke="white" stroke-width="5" fill="none">
    <line x1="0" y1="-19" x2="0" y2="-125"/>
    <line x1="19" y1="0" x2="125" y2="0"/>
    <line x1="0" y1="19" x2="0" y2="125"/>
    <line x1="-19" y1="0" x2="-125" y2="0"/>
    <line x1="13.4" y1="-13.4" x2="88.4" y2="-88.4"/>
    <line x1="-13.4" y1="-13.4" x2="-88.4" y2="-88.4"/>
    <line x1="-13.4" y1="13.4" x2="-88.4" y2="88.4"/>
    <line x1="13.4" y1="13.4" x2="88.4" y2="88.4"/>
    <line x1="16.5" y1="-9.5" x2="108.3" y2="-62.5"/>
    <line x1="9.5" y1="-16.5" x2="62.5" y2="-108.3"/>
    <line x1="-9.5" y1="-16.5" x2="-62.5" y2="-108.3"/>
    <line x1="-16.5" y1="-9.5" x2="-108.3" y2="-62.5"/>
  </g>
  <g stroke="#D3D1C7" stroke-width="1" fill="none" stroke-dasharray="2 2">
    <line x1="0" y1="-19" x2="0" y2="-125"/>
    <line x1="19" y1="0" x2="125" y2="0"/>
    <line x1="0" y1="19" x2="0" y2="125"/>
    <line x1="-19" y1="0" x2="-125" y2="0"/>
    <line x1="13.4" y1="-13.4" x2="88.4" y2="-88.4"/>
    <line x1="-13.4" y1="-13.4" x2="-88.4" y2="-88.4"/>
    <line x1="-13.4" y1="13.4" x2="-88.4" y2="88.4"/>
    <line x1="13.4" y1="13.4" x2="88.4" y2="88.4"/>
    <line x1="16.5" y1="-9.5" x2="108.3" y2="-62.5"/>
    <line x1="9.5" y1="-16.5" x2="62.5" y2="-108.3"/>
    <line x1="-9.5" y1="-16.5" x2="-62.5" y2="-108.3"/>
    <line x1="-16.5" y1="-9.5" x2="-108.3" y2="-62.5"/>
  </g>

  <!-- Outer border -->
  <circle cx="0" cy="0" r="127" fill="none" stroke="#5F5E5A" stroke-width="1.5"/>

  <!-- Center water + handling -->
  <circle cx="0" cy="0" r="19" fill="#E6F1FB" stroke="#185FA5" stroke-width="2"/>
  <text x="0" y="-3" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" font-weight="500" fill="#0C447C">WATER</text>
  <text x="0" y="8" text-anchor="middle" font-family="system-ui, sans-serif" font-size="7" fill="#185FA5">+ pen</text>

  <!-- Rotation arrow -->
  <path d="M0,-120 A120,120 0 0,1 84.8,84.8" fill="none" stroke="#1D9E75" stroke-width="2" marker-end="url(#arr)" stroke-dasharray="5 3"/>
</g>

<!-- 12-paddock notes -->
<text x="510" y="384" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5F5E5A">11 paddocks resting · 1 grazing</text>
<text x="510" y="396" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5F5E5A">60d rest ÷ 5d grazing + 1 = 13 (use 12)</text>
<text x="510" y="408" text-anchor="middle" font-family="system-ui, sans-serif" font-size="9" fill="#5F5E5A">Dry season: extend rest, reduce stock</text>

<!-- Shared legend bottom -->
<rect x="30" y="374" width="8" height="8" rx="1" fill="#1D9E75"/>
<text x="42" y="382" font-family="system-ui, sans-serif" font-size="9" fill="#2C2C2A">Actively grazing</text>
<rect x="110" y="374" width="8" height="8" rx="1" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="122" y="382" font-family="system-ui, sans-serif" font-size="9" fill="#2C2C2A">Resting / recovering</text>
<rect x="218" y="374" width="8" height="8" rx="1" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.5" stroke-dasharray="2 1"/>
<text x="230" y="382" font-family="system-ui, sans-serif" font-size="9" fill="#2C2C2A">Sacrifice (dry season)</text>
<line x1="326" y1="374" x2="340" y2="374" stroke="#D3D1C7" stroke-width="1.5" stroke-dasharray="2 1"/>
<text x="344" y="382" font-family="system-ui, sans-serif" font-size="9" fill="#2C2C2A">Access lanes (always open)</text>
<circle cx="452" cy="378" r="5" fill="#E6F1FB" stroke="#185FA5" stroke-width="1.5"/>
<text x="460" y="382" font-family="system-ui, sans-serif" font-size="9" fill="#2C2C2A">Central water + handling</text>

<text x="340" y="415" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" fill="#888780">Figure F-07 · Cattle move counter-clockwise one paddock per grazing period · Formula: # paddocks = rest period ÷ grazing period + 1</text>
</svg>