<!doctype html>
<html lang="es-MX">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Verificación · LibretApp</title>
  <style>
    :root{font-family:system-ui,sans-serif;color:#18332d;background:#f5f8f4}
    body{margin:0;min-height:100vh;display:grid;place-items:center}
    main{box-sizing:border-box;width:min(100%,28rem);padding:1.5rem}
    h1{margin:0 0 .5rem;font-size:1.5rem}
    p{line-height:1.5}
  </style>
  <script src="/captcha/config.js?v=20261031"></script>
</head>
<body><main><h1>Verifica tu acceso</h1><p id="status" role="status" aria-live="polite">Cargando verificación…</p><div id="captcha"></div></main>
<script>
window.onLibretReady = function () {
  const key = window.LIBRET_CAPTCHA_SITE_KEY;
  const status = document.querySelector('#status');
  if (!key) { status.textContent = 'La verificación todavía no está configurada.'; return; }
  window.turnstile.render('#captcha', {
    sitekey: key,
    callback: function (token) {
      if (window.LibretCaptcha) window.LibretCaptcha.postMessage(token);
      status.textContent = 'Verificación completada. Puedes volver a la app.';
    },
    'expired-callback': function () { status.textContent = 'La verificación venció. Inténtalo de nuevo.'; },
    'error-callback': function () { status.textContent = 'No se pudo verificar. Cierra esta pantalla e inténtalo de nuevo.'; }
  });
};
</script>
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?onload=onLibretReady&render=explicit" async defer></script>
</body></html>
