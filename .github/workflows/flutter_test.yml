name: Flutter test

on:
  push:
    branches: [main, main-5enhm8]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libretapp
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Provide native Isar library for desktop tests
        run: |
          lib=$(find "$HOME/.pub-cache" -name libisar.so -path '*isar_flutter_libs*linux*' | head -n1)
          cp "$lib" libisar.so

      # Existing info-level lint debt is reported but does not fail the build.
      # New analyzer warnings and errors remain blocking.
      - run: flutter analyze --no-fatal-infos

      - run: flutter test

  supabase-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libretapp
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - run: supabase test db
