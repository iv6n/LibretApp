name: Flutter test

on:
  push:
    branches: [main, main-5enhm8]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libretapp
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Provide native Isar library for desktop tests
        run: |
          lib=$(find "$HOME/.pub-cache" -name libisar.so -path '*isar_community_flutter_libs*linux*' | head -n1)
          cp "$lib" libisar.so

      # Existing info-level lint debt is reported but does not fail the build.
      # New analyzer warnings and errors remain blocking.
      - run: flutter analyze --no-fatal-infos

      - run: flutter test

      - name: Verify store candidate gates
        run: python3 -m unittest discover -s tool -p test_candidate_gates.py -v

      - name: Verify offline pilot restrictions with configured provider values
        run: >-
          flutter test test/core/platform/offline_pilot_test.dart test/regressions
          --dart-define=LIBRETAPP_OFFLINE_PILOT=true
          --dart-define=SUPABASE_URL=https://offline.invalid
          --dart-define=SUPABASE_ANON_KEY=offline-placeholder

  android-qa:
    strategy:
      fail-fast: false
      matrix:
        flavor: [offline, connected]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libretapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true
      - run: flutter pub get
      - name: Build QA bundle using disposable test signing
        run: python3 tool/build_android_candidate.py --mode qa --flavor ${{ matrix.flavor }} --out artifacts/ci-android
      - name: Verify QA bundle signature
        run: jarsigner -verify build/app/outputs/bundle/${{ matrix.flavor }}Release/app-${{ matrix.flavor }}-release.aab
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-${{ matrix.flavor }}-qa-not-for-store
          path: |
            libretapp/artifacts/ci-android
            libretapp/build/app/outputs/bundle/${{ matrix.flavor }}Release/*.aab
          retention-days: 14

  android-integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flavor: [offline, connected]
        api: [28, 36]
        include:
          - api: 28
            target: google_apis
            label: minimum
          - api: 36
            target: google_apis_ps16k
            label: current-16kb
    defaults:
      run:
        working-directory: libretapp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          cache: true
      - run: flutter pub get
      - name: Enable KVM for the dedicated test emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test native journeys
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          disable-animations: true
          working-directory: libretapp
          script: flutter test integration_test/${{ matrix.flavor }}_journey_test.dart --no-pub --flavor ${{ matrix.flavor }} --reporter expanded 2>&1 | tee android-integration.log; exit ${PIPESTATUS[0]}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-integration-${{ matrix.flavor }}-${{ matrix.label }}
          path: libretapp/android-integration.log
          retention-days: 14

  supabase-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: libretapp
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno test --allow-env supabase/functions/_shared
      - run: deno check supabase/functions/send-sms/index.ts supabase/functions/delete-account/index.ts supabase/functions/resume-deletions/index.ts
      - run: supabase start
      - run: supabase test db
